name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run typecheck
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t munshi:ci .
      - name: Smoke-test the container
        run: |
          docker run -d --name munshi -p 3000:3000 munshi:ci
          for i in $(seq 1 30); do
            curl -fsS http://localhost:3000/healthz && break
            sleep 1
          done
          curl -fsS http://localhost:3000/healthz | grep -q '"ok":true'
          curl -fsS http://localhost:3000/soundbox | grep -q '<div id="root">'
          curl -fsS -X POST http://localhost:3000/api/next -H 'content-type: application/json' -d '{}' | grep -q 'Sharma ji'
      - name: Container logs
        if: always()
        run: docker logs munshi || true

  # The Soundbox Android app. Screenshot tests render (catching layout crashes) but are not
  # pixel-verified here: the golden images are recorded on Windows. Verify locally.
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew testDebugUnitTest assembleDebug --console=plain
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: munshi-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
